<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1139px;height:976px;background:#FFFFFF;" width="1139px" height="976px" viewBox="0 0 1139 976" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="411.256" y="33.535" fill="#000" font-size="14" textLength="314.938" font-weight="700">Staged roadmap and the DSL decision point</text></g><rect x="20" y="54.785" width="1092.451" height="21.199" fill="none" style="stroke:none;"/><ellipse cx="168.911" cy="90.984" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="43.344" y="120.984" width="251.135" height="90.664" fill="#DDF2DD" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53.344" y="142.586" fill="#000" font-size="12" textLength="120.182">Stage 0 (this branch)</text><text x="53.344" y="156.719" fill="#000" font-size="12" textLength="219.861">reference_token, association&lt;L,R,D>,</text><text x="53.344" y="170.852" fill="#000" font-size="12" textLength="222.68">resolve&lt;>() registration, pre-dispatch</text><text x="53.344" y="184.984" fill="#000" font-size="12" textLength="231.135">resolution, post-dispatch local binding,</text><text x="53.344" y="199.117" fill="#000" font-size="12" textLength="207.668">same-cell and ancestor-cell targets</text><path d="M331.822,241.948 L331.822,265.914 L311.822,269.914 L331.822,273.914 L331.822,297.88 A0,0 0 0 0 331.822,297.88 L604.57,297.88 A0,0 0 0 0 604.57,297.88 L604.57,251.948 L594.57,241.948 L331.822,241.948 A0,0 0 0 0 331.822,241.948" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M594.57,241.948 L594.57,251.948 L604.57,251.948 L594.57,241.948" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="337.822" y="259.517" fill="#000" font-size="13" textLength="244.823">No user dictionary needed: association</text><text x="337.822" y="274.827" fill="#000" font-size="13" textLength="251.748">is a framework type.  D must already be</text><text x="337.822" y="290.138" fill="#000" font-size="13" textLength="115.578">a persistable type.</text><rect x="26" y="231.648" width="285.822" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="253.25" fill="#000" font-size="12" textLength="43.131">Stage 1</text><text x="36" y="267.383" fill="#000" font-size="12" textLength="233.842">FORM round-trip of association&lt;L,R,D></text><text x="36" y="281.516" fill="#000" font-size="12" textLength="173.684">(one generic container layout:</text><text x="39.797" y="295.648" fill="#000" font-size="12" textLength="262.025">cell_coordinate, product_locator, element, D)</text><rect x="50.41" y="328.18" width="237.002" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="60.41" y="349.781" fill="#000" font-size="12" textLength="43.131">Stage 2</text><text x="60.41" y="363.914" fill="#000" font-size="12" textLength="189.24">Descendant / sibling cell targets</text><text x="60.41" y="378.047" fill="#000" font-size="12" textLength="202.014">(gather operator: one message per</text><text x="64.207" y="392.18" fill="#000" font-size="12" textLength="213.205">target cell, keyed by cell_coordinate)</text><rect x="40.856" y="424.711" width="256.109" height="76.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.856" y="446.313" fill="#000" font-size="12" textLength="43.131">Stage 3</text><text x="50.856" y="460.445" fill="#000" font-size="12" textLength="202.512">Reference sets and many-to-many</text><text x="50.856" y="474.578" fill="#000" font-size="12" textLength="220.518">convenience views (grouped iteration,</text><text x="50.856" y="488.711" fill="#000" font-size="12" textLength="236.109">one-to-one enforcement at registration)</text><rect x="47.146" y="822.613" width="243.529" height="90.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.146" y="844.215" fill="#000" font-size="12" textLength="43.131">Stage 5</text><text x="57.146" y="858.348" fill="#000" font-size="12" textLength="196.143">Cross-file / cross-job references:</text><text x="57.146" y="872.48" fill="#000" font-size="12" textLength="197.672">product_locator gains provenance</text><text x="57.146" y="886.613" fill="#000" font-size="12" textLength="223.529">(process/stage chain) and FORM maps</text><text x="57.146" y="900.746" fill="#000" font-size="12" textLength="143.379">locator -> file/container</text><ellipse cx="168.911" cy="944.277" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="168.911" cy="944.277" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="54.785" x2="20" y2="955.277" style="stroke:#000;stroke-width:1.5;"/><polygon points="778.765,521.242,981.867,521.242,993.867,534.197,981.867,547.152,778.765,547.152,766.765,534.197,778.765,521.242" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="778.765" y="531.877" fill="#000" font-size="11" textLength="203.103">References embedded in user product</text><text x="778.765" y="544.832" fill="#000" font-size="11" textLength="166.536">types (Hit contains ref&lt;Wire>)?</text><text x="749.282" y="531.877" fill="#000" font-size="11" textLength="17.483">yes</text><text x="993.867" y="531.877" fill="#000" font-size="11" textLength="13.583">no</text><rect x="615.57" y="557.152" width="273.975" height="133.063" fill="#FFE9C6" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="625.57" y="578.754" fill="#000" font-size="12" textLength="115.025" font-weight="700">DSL decision point</text><text x="625.57" y="592.887" fill="#000" font-size="12" textLength="253.975">YAML (or Jsonnet) product description with:</text><text x="625.57" y="607.02" fill="#000" font-size="12" textLength="248.678">- ref members: target concept, cardinality,</text><text x="633.164" y="621.152" fill="#000" font-size="12" textLength="244.799">cell scope (same | ancestor:&lt;layer> | any)</text><text x="625.57" y="635.285" fill="#000" font-size="12" textLength="212.127">- schema_version + migration block</text><text x="625.57" y="649.418" fill="#000" font-size="12" textLength="251.93">Generator emits: C++ struct, resolved view</text><text x="625.57" y="663.551" fill="#000" font-size="12" textLength="248.859">struct, ROOT selection XML/LinkDef, HDF5</text><text x="625.57" y="677.684" fill="#000" font-size="12" textLength="211.951">compound layout, FORM descriptors</text><rect x="626.94" y="710.215" width="251.234" height="62.398" fill="#FFE9C6" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="636.94" y="731.816" fill="#000" font-size="12" textLength="43.131">Stage 4</text><text x="636.94" y="745.949" fill="#000" font-size="12" textLength="231.234">Embedded references pre-resolved into</text><text x="636.94" y="760.082" fill="#000" font-size="12" textLength="188.52">generated "&lt;T>_resolved" views</text><rect x="909.545" y="557.152" width="197.059" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="919.545" y="578.754" fill="#000" font-size="12" textLength="167.93">Associations remain the only</text><text x="919.545" y="592.887" fill="#000" font-size="12" textLength="177.059">reference carrier; DSL optional</text><polygon points="880.316,778.613,892.316,790.613,880.316,802.613,868.316,790.613,880.316,778.613" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="609.57" y1="54.785" x2="609.57" y2="955.277" style="stroke:#000;stroke-width:1.5;"/><line x1="1110.604" y1="54.785" x2="1110.604" y2="955.277" style="stroke:#000;stroke-width:1.5;"/><line x1="168.911" y1="1